[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiosis-relay"
version = "0.2.1"  # + oregon-support packaging for 19557e65 cross-device receiver (back-compat)
description = "Symbiosis Relay — Washington activator, device selector, listener, beacon (nervous source for mirror kits)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Grok (symbiosis auton 19557e65)"}]
dependencies = ["slack-sdk>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
washington-activator = "washington_activator:main"
inject-hermes-task = "inject_hermes_task:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
